<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The State of Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;700&family=Noto+Sans+Armenian:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e1e1e;--fg:#fffdf8;--mut:#a9a9a2;--line:#3a3a3a;--inv:0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root{--bg:#fffdf8;--fg:#1e1e1e;--mut:#6b6b66;--line:#d6d3ca;--inv:1}}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Jost','Noto Sans Armenian',system-ui,sans-serif;font-weight:300;line-height:1.6;font-size:18px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{font-size:20px;letter-spacing:.01em;text-decoration:none;color:var(--fg)}
.brand b{font-weight:700}
nav{display:flex;gap:26px;font-size:15px}
nav a{color:var(--mut);text-decoration:none}nav a:hover{color:var(--fg)}
.lang{display:flex;border:1px solid var(--line)}
.lang button{background:none;border:0;color:var(--mut);font:inherit;font-size:14px;padding:6px 11px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.hero{padding:88px 24px 72px;text-align:left}
.logo{width:min(380px,78vw);height:auto;display:block;filter:invert(var(--inv))}
.tag{display:inline-flex;margin-top:28px;border:1px solid var(--fg);font-size:12px;letter-spacing:.06em;text-transform:uppercase;line-height:1.35}
.tag span{padding:10px 14px}.tag .l{background:var(--fg);color:var(--bg)}.tag .r b{font-weight:700}
h1{font-size:clamp(30px,5.4vw,54px);font-weight:300;line-height:1.15;margin:48px 0 16px;max-width:15em}
h1 b{font-weight:700}
.lead{color:var(--mut);max-width:34em;font-size:20px;margin:0 0 36px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:14px 26px;border:1px solid var(--fg);color:var(--fg);text-decoration:none;font-size:16px;font-weight:400}
.btn.p{background:var(--fg);color:var(--bg)}
section{padding:72px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(26px,4vw,40px);font-weight:300;margin:0 0 20px;line-height:1.2}
h2 b{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px}
.card{border:1px solid var(--line);padding:28px}
.card h3{margin:0 0 10px;font-size:22px;font-weight:700}
.card p{margin:0;color:var(--mut);font-size:17px}
.n{font-size:13px;color:var(--mut);letter-spacing:.12em;margin-bottom:14px}
.about p{max-width:36em;color:var(--mut);font-size:20px;margin:0}
.apply{text-align:center}
.apply p{max-width:32em;margin:0 auto 14px;color:var(--mut)}
.apply .btns{justify-content:center;margin-top:28px}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--mut);font-size:14px}
.f{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.f a{color:var(--mut);margin-left:18px}
@media(max-width:800px){nav{display:none}.grid{grid-template-columns:1fr}.hero{padding:56px 28px 48px}section{padding:52px 0}}
</style>
</head>

function setLang(l){
  var d=T[l]||T.en;
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(function(e){e.innerHTML=d[e.getAttribute("data-i")]});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===l)});
  try{localStorage.setItem("lang",l)}catch(e){}
}
document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){setLang(b.dataset.l)}});
